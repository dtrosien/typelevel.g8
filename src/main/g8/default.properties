name = typelevel-app
organization = com.example
package = $organization$.$name;format="norm,word"$
scala_version = 3.9.0
sbt_version = 2.0.9
toolkit_version = 0.2.0
pureconfig_version = 0.17.10
fs2_kafka_version = 4.1.0
# Must match the weaver version that toolkit-test is built against,
# otherwise sbt's early-semver eviction check fails the build.
weaver_version = 0.12.0
description = A Typelevel Toolkit project with weaver and ScalaCheck tests
github_user = dtrosien
developer_name = Dominik Trosien
developer_email = dominiktrosien@yahoo.de
# Files copied without template substitution (GitHub Actions uses \$\{\{ }}).
verbatim = *.yml *.yaml
