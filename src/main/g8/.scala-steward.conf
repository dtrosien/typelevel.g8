# weaver must stay on the version that toolkit-test is built against,
# otherwise sbt's early-semver eviction check fails the build.
# When a toolkit bump moves toolkit-test to a newer weaver, update this pin
# and weaver_version together.
updates.pin = [
  { groupId = "org.typelevel", artifactId = "weaver-scalacheck", version = "$weaver_version$" }
]
